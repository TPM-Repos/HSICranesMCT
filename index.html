<!-- Version 1.2.9 -->
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="IE=Edge" />
		
		<!-- PWA Meta Tags -->
		<meta name="theme-color" content="#ffffff"/>
		<meta name="description" content="HSI Cranes Machine Configuration Tool"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
		<meta name="apple-mobile-web-app-title" content="HSI MCT"/>
		
		<title>Login</title>

		<!-- PWA Assets -->
		<link rel="manifest" href="site.webmanifest"/>
		<link rel="apple-touch-icon" href="apple-touch-icon.png"/>

		<!-- Scripts -->
		<script src="dist/js/pwa.js" defer></script>
		<script src="dist/js/loadClient.js" defer></script>
		<script src="configUser.js" defer onload="loadClient()"></script>
		<script src="dist/js/login.js" defer></script>
		<script src="dist/js/ui.js" defer></script>

		<!-- Core Styles -->
		<link rel="stylesheet" type="text/css" href="dist/css/core.css" />

		<!-- Theme Styles (customizable) -->
		<link
			rel="stylesheet"
			type="text/css"
			href="dist/css/theme/theme.css"
		/>
		<link
			rel="stylesheet"
			type="text/css"
			href="dist/css/theme/login.css"
		/>
		<link
			rel="stylesheet"
			type="text/css"
			href="dist/css/theme/fonts.css"
		/>

		<!-- Header -->
		<link rel="stylesheet" type="text/css" href="dist/css/header.css" />
		<script src="dist/js/header.js" defer></script>

		<!-- Favicon -->
		<link rel="icon" href="favicon.ico" />
	</head>

	<body class="template-login">
		<div class="login-container">
			<form id="login-form" class="login-form" onsubmit="return false;">
				<div class="login-logo">
					<img id="logo" />
				</div>

				<h1 class="login-title">Welcome to Quotinator 2.0!</h1>
				<p class="login-information">
					Click the button below to configure and quote your crane.
				</p>

				<div id="login-notice" class="login-notice"></div>

					<button
						type="button"
						id="login-guest-button"
						class="login-button hidden"
						disabled
					>
						Get Started
					</button>
					
					<!-- PWA Cache Debug Button -->
					<!-- <button
						type="button"
						id="clear-cache-button"
						class="login-button"
						style="margin-top: 10px; background-color: #f44336;"
						onclick="clearPWACache(); setTimeout(() => window.location.reload(true), 500);"
					>
						Clear Cache & Refresh
					</button> -->
				</div>

				<div class="login-copyright">HSI Crane, Inc. - 2024</div>
			</form>

			<div class="login-cover"></div>
		</div>
	</body>
</html>
