		<script src="dist/js/loadClient.js"></script>

			document.addEventListener('DOMContentLoaded', function() {
				if (typeof loadClient === 'function') {
					loadClient();
				}
			});
		</script>
		<script src="dist/js/login.js"></script>
		<script src="dist/js/core.js"></script>
		<script src="dist/js/sidebar.js"></script>
		<script src="dist/js/ui.js"></script>

		<link
			rel="stylesheet"
			type="text/css"
			href="dist/css/theme/theme.css"
		/>
		<link

			href="dist/css/theme/projects.css"
		/>

		<link
			rel="stylesheet"
			type="text/css"
			href="dist/css/theme/fonts.css"

	<body class="template-projects has-navigation">

			<aside class="content-nav">
				<div class="logo-wrap">
					<a href="index.html" class="logo">
						<img id="logo" />
					</a>

					<button id="nav-toggle" class="nav-toggle" title="Menu">
						<svg class="icon">
							<use xlink:href="dist/icons.svg#menu" />
							<title>Menu</title>
						</svg>
					</button>
				</div>

				<div class="user-actions">
					<div id="active-username" class="active-username">
						<svg class="icon">
							<use xlink:href="dist/icons.svg#user" />
						</svg>
						<span class="username"></span>
					</div>
				</div>
			</aside>

			<section class="content-inner">
				<div class="project-inner">
					<div class="section-title">
						<h1>Select product type</h1>
					</div>

					<div
						id="project-list"
						class="project-list"
						style="opacity: 0"

						<div class="project-item skeleton-item">
							<div class="skeleton-block"></div>
						</div>
						<div class="project-item skeleton-item">
							<div class="skeleton-block"></div>
						</div>

							<div class="skeleton-block"></div>
						</div>
						<div class="project-item skeleton-item">
							<div class="skeleton-block"></div>
						</div>
					</div>
				</div>
			</section>

			<button
				type="button"
				id="nav-close"
				class="nav-overlay"
				title="Close Menu"
			>
				Close Menu
			</button>
		</main>
	</body>
